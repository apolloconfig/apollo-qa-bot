server:
  port: 9090

management:
  endpoints:
    web:
      base-path: /

logging:
  file:
    name: /opt/logs/qa-bot.log

cors:
  # the allowed origins for the site that can access the QA bot
  allowedOrigins:
    - '*'

assistant:
  # the model for the assistant
  model: gpt-5-nano
  # the assistant name
  name: apollo-qa-bot
  # the instructions used to generate the answer
  instructions: |
    You are an Apollo (microservice configuration management) Q&A assistant. Auto-detect the question’s language and respond in the same language with a concise, conversational style.
    When needed, use file_search to retrieve authoritative docs/files and ground your answer in what you find. Do not guess. If you cannot find a reliable answer, reply exactly: Hmm, I'm not sure.
    Output only the answer—no prefaces, disclaimers, or tool traces. Do not include any file references in the answer body; if sources are needed, return them via annotations.fileCitation only (not in the text). Use lists or code blocks for commands/configs when helpful.
  # the vector store id
  vector-store-id: xxxxxxxxxx

markdown:
  files:
    # the markdown files location, e.g. for apollo, it's the folder of https://github.com/apolloconfig/apollo/tree/master/docs
    location: xxxxxxxxxx
    # the markdown files roots in the documentation site, e.g. for apollo, it's /zh and /en
    # https://github.com/apolloconfig/apollo/blob/master/docs/zh/design/apollo-design.md => https://www.apolloconfig.com/#/zh/design/apollo-design
    # https://github.com/apolloconfig/apollo/blob/master/docs/en/design/apollo-design.md => https://www.apolloconfig.com/#/en/design/apollo-design
    roots:
      - /zh
      - /en
    # whether to enable the markdown files auto update
    scheduleEnabled: false
    # the cron expression for the markdown files auto update
    scheduleCron: 0 0 * * * ? # every hour
  processor:
    # the retry configuration when accessing openai failed
    retry:
      delay: 10000
      multiplier: 1.5
      maxDelay: 120000
      maxElapsedTime: 600000